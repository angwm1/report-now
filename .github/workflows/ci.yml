name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    # The app lives in report-now/; the repo root holds coursework.
    defaults:
      run:
        working-directory: report-now

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: report-now/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint checks
        run: npm run lint

      - name: Run Jest test suite with coverage
        run: npx jest --coverage --runInBand
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/reportnow_test"
          NEXTAUTH_SECRET: "ci-test-secret-at-least-32-chars-long"
          OPENAI_API_KEY: "sk-test-key-for-mocked-ci"

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/reportnow_test"
          NEXTAUTH_SECRET: "ci-test-secret-at-least-32-chars-long"
          OPENAI_API_KEY: "sk-test-key-for-mocked-ci"
